<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartPrice - AI Price Comparison</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #e2e8f0;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 40px 16px 10px;
    }
    header h1 { font-size: 34px; color: #fff; letter-spacing: 1px; }
    header h1 span { color: #fbbf24; }
    header p { color: #94a3b8; margin-top: 6px; }

    .search {
      max-width: 620px;
      margin: 24px auto;
      display: flex;
      gap: 8px;
      padding: 0 16px;
    }
    .search input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
    }
    .search input:focus { border-color: #fbbf24; }
    .search button {
      padding: 13px 22px;
      border: none;
      border-radius: 10px;
      background: #fbbf24;
      color: #0f172a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .chips {
      max-width: 620px;
      margin: 0 auto 20px;
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .chips button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .chips button:hover { border-color: #fbbf24; color: #fff; }

    #results { max-width: 860px; margin: 0 auto; padding: 0 16px 60px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .card-head {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #334155;
    }
    .card-head h2 { font-size: 19px; }
    .card-head .cat { color: #94a3b8; font-size: 13px; }
    .verdict {
      font-size: 13px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .verdict.buy { background: #065f46; color: #6ee7b7; }
    .verdict.wait { background: #7c2d12; color: #fdba74; }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px 20px;
      text-align: left;
      border-top: 1px solid #1e293b;
      font-size: 14px;
    }
    th { background: #24314a; color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    td.seller { font-weight: 600; }
    td.price { font-weight: 700; font-variant-numeric: tabular-nums; }
    tr.best { background: rgba(251, 191, 36, 0.08); }
    tr.best td.price { color: #fbbf24; }
    .badge {
      font-size: 11px;
      background: #fbbf24;
      color: #0f172a;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 8px;
    }
    .arrow.down { color: #4ade80; }
    .arrow.up { color: #f87171; }
    .arrow.flat { color: #94a3b8; }
    .advice {
      padding: 14px 20px;
      font-size: 14px;
      border-top: 1px solid #334155;
      color: #cbd5e1;
    }
    .advice b { color: #fbbf24; }
    #status { text-align: center; color: #94a3b8; padding: 40px 16px; }

    @media (max-width: 600px) {
      header h1 { font-size: 26px; }
      .search { flex-direction: column; }
      th, td { padding: 10px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Smart<span>Price</span>.AI</h1>
    <p>Compare brands &amp; sites, find the least price, and let AI tell you when to buy.</p>
  </header>

  <div class="search">
    <input id="q" type="text" placeholder="Try: iPhone, laptop, headphones, shoes..." autofocus>
    <button onclick="search()">Search</button>
  </div>

  <div class="chips" id="chips"></div>

  <div id="status">Search any product above to get started.</div>

  <div id="results"></div>

  <script>
    let catalog = [];

    async function init() {
      const r = await fetch('/api/catalog');
      const data = await r.json();
      catalog = data.names.slice(0, 6);
      const c = document.getElementById('chips');
      catalog.forEach(n => {
        const b = document.createElement('button');
        b.textContent = n;
        b.onclick = () => { document.getElementById('q').value = n; search(); };
        c.appendChild(b);
      });
    }

    async function search() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      const status = document.getElementById('status');
      const box = document.getElementById('results');
      status.textContent = 'Searching...';
      box.innerHTML = '';

      const r = await fetch('/api/search?q=' + encodeURIComponent(q));
      const data = await r.json();

      if (!data.count) {
        status.textContent = 'No product found for "' + q + '". Try iPhone, laptop, headphones or shoes.';
        return;
      }
      status.textContent = '';
      data.products.forEach(p => box.appendChild(renderCard(p)));
    }

    function arrowClass(p) {
      return p.slope > 0.01 ? 'up' : (p.slope < -0.01 ? 'down' : 'flat');
    }

    function arrowMark(c) {
      if (c === 'up') return '&#9650;';
      if (c === 'down') return '&#9660;';
      return '&#9654;';
    }

    function renderCard(p) {
      const card = document.createElement('div');
      card.className = 'card';

      const head = document.createElement('div');
      head.className = 'card-head';
      head.innerHTML = '<div><h2>' + p.name + '</h2><div class="cat">' + p.category + '</div></div>';
      const v = document.createElement('span');
      v.className = 'verdict ' + (p.verdict === 'BUY NOW' ? 'buy' : 'wait');
      v.textContent = p.verdict;
      head.appendChild(v);

      const table = document.createElement('table');
      let rows = '<tr><th>Seller</th><th>Current Price</th><th>Predicted (2 wks)</th><th>Trend</th></tr>';
      p.rows.forEach(rp => {
        const isBest = rp.seller === p.least.seller;
        const cls = isBest ? 'arrow down' : arrowClass(rp);
        rows +=
          '<tr class="' + (isBest ? 'best' : '') + '">' +
          '<td class="seller">' + rp.seller + (isBest ? '<span class="badge">LOWEST</span>' : '') + '</td>' +
          '<td class="price">Rs. ' + rp.current.toLocaleString('en-IN') + '</td>' +
          '<td>Rs. ' + rp.predicted.toLocaleString('en-IN') + '</td>' +
          '<td><span class="arrow ' + arrowClass(rp) + '">' + arrowMark(arrowClass(rp)) + '</span>' +
          (rp.slope > 0.01 ? ' rising' : rp.slope < -0.01 ? ' falling' : ' stable') + '</td>' +
          '</tr>';
      });
      table.innerHTML = rows;

      const advice = document.createElement('div');
      advice.className = 'advice';
      advice.innerHTML = '<b>AI Advice:</b> ' + p.advice;

      card.appendChild(head);
      card.appendChild(table);
      card.appendChild(advice);
      return card;
    }

    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    init();
  </script>
</body>
</html>
